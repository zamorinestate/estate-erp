  <script>
    (function() {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var r of registrations) { r.unregister(); }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var n of names) caches.delete(n);
          });
        }
        var savedTheme = localStorage.getItem('zamorin-theme') || 'paper';
        document.documentElement.dataset.theme = savedTheme;
        var savedFontSize = localStorage.getItem('zamorin-font-size') || 'standard';
        document.documentElement.dataset.fontSize = savedFontSize;
      } catch (e) {}
    })();
    // Dynamic API URL Resolution:

    window.ZAMORIN_API_BASE_URL = window.ZAMORIN_API_BASE_URL ||
      localStorage.getItem('zamorin_api_url') ||
      (window.location.hostname.includes('vercel.app')
        ? '/api/v1'
        : 'https://zamorin-cafe-erp.vercel.app/api/v1');
