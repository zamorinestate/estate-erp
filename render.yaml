services:
  - type: web
    name: zamorin-cafe-erp-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --only=production
    startCommand: node src/scripts/startProd.js
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: PRODUCTION
      - key: REQUIRE_PERSISTENT_DB
        value: "true"
      - key: ALLOW_MEMORY_DB
        value: "false"
      - key: PORT
        value: 4000
      - key: TZ
        value: Asia/Kolkata
      - key: DNS_SERVERS
        value: 8.8.8.8,1.1.1.1
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_KEY_PREFIX
        value: zamorin:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: QR_SIGNING_SECRET
        sync: false
      - key: ATTENDANCE_QR_SECRET
        sync: false
      - key: PUBLIC_APP_ORIGIN
        value: https://zamorin-cafe-erp.vercel.app
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_TTL_MINUTES
        value: 15
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 7
      - key: SESSION_ABSOLUTE_TTL_DAYS
        value: 7
      - key: SESSION_IDLE_TIMEOUT_MINUTES
        value: 30
      - key: STEP_UP_AUTH_MAX_AGE_MINUTES
        value: 10
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: ZAMORIN_ANDROID_APP_PACKAGE
        value: com.zamorin.cafe.erp
      - key: ZAMORIN_ANDROID_APP_CERT_SHA256
        sync: false
      - key: ZAMORIN_PRINT_DISPATCH_PRIVATE_KEY_PKCS8_B64
        sync: false
      - key: INITIAL_ORGANISATION_ID
        value: ZAMORIN
      - key: INITIAL_MASTER_NAME
        value: Zamorin Master
      - key: INITIAL_MASTER_EMAIL
        sync: false
      - key: INITIAL_MASTER_PASSWORD
        sync: false
      - key: SEED_MINIMAL
        value: "true"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: MONGODB_MAX_POOL_SIZE
        value: 50
      - key: MONGODB_MIN_POOL_SIZE
        value: 10
      - key: MONGODB_SERVER_SELECTION_TIMEOUT_MS
        value: 15000
      - key: PRIVATE_STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: WEBAUTHN_RP_NAME
        value: Zamorin Cafe ERP
      - key: WEBAUTHN_RP_ID
        value: zamorin-cafe-erp.vercel.app
      - key: WEBAUTHN_ORIGIN
        value: https://zamorin-cafe-erp.vercel.app
      - key: DOCUMENT_STORAGE_PROVIDER
        value: gridfs
      - key: DOCUMENT_GRIDFS_BUCKET
        value: zamorinDocuments
      - key: DOCUMENT_STORAGE_MAX_BYTES
        value: 15728640
      - key: REQUIRE_DOCUMENT_SCANNER
        value: "false"
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: 3310
      - key: ATTENDANCE_ORPHAN_GRACE_MINUTES
        value: 60

