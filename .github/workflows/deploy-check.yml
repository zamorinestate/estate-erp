name: Deployment Configuration & Invariant Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-audit:
    name: Pre-Flight Deployment Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Audit Production Dependencies
        run: npm run audit:deps

      - name: Verify Blueprint & Server Syntax
        working-directory: ./backend
        run: |
          node --check src/server.js
          node --check src/scripts/startProd.js
          node --check src/scripts/verifyDeploymentConfig.js

      - name: Validate Router & Module Integrity
        run: |
          node frontend/verifyRouterImports.mjs
          node scripts/master_system_verification.mjs

      - name: Verify Release Governance Truth
        run: |
          if grep -q "100% PRODUCTION READY & CERTIFIED" scripts/master_system_verification.mjs; then
            echo "ERROR: software verifier must not claim commercial production certification"
            exit 1
          fi
          grep -q "AUTOMATED SOFTWARE VERIFICATION PASS" scripts/master_system_verification.mjs
          grep -q "validateExt19CutoverReadiness.ps1 -AttemptCutover" .github/workflows/release-gate.yml
          if grep -q "0.0.0.0/0 wildcard IP entry" scripts/validateExt19CutoverReadiness.ps1; then
            echo "ERROR: EXT-19 contains retired Atlas wildcard-access blocker"
            exit 1
          fi

      - name: Run Release Governance Regression Suites
        run: |
          node --test \
            backend/test/ext09GitHubReleaseGovernance.test.js \
            backend/test/ext19ProductionCutoverReadiness.test.js
